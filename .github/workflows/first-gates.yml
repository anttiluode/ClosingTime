name: First real gates

on:
  workflow_dispatch:

jobs:
  gate1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[models]
      - run: python experiments/gate1_decompose_behavior.py --controls 128
      - uses: actions/upload-artifact@v4
        with:
          name: gate1-results
          path: results/gate1/audit.json

  gate2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[models]
      - run: python experiments/gate2_qk_transplant.py --texts 8 --donors 6
      - uses: actions/upload-artifact@v4
        with:
          name: gate2-results
          path: results/gate2/audit.json
